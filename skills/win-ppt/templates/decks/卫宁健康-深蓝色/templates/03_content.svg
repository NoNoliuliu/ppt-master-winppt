<svg height="720" width="1280" data-pptx-master="win_3" data-pptx-master-name="卫宁健康-深蓝色" data-pptx-layout="win_3_4" data-pptx-layout-name="03_content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <defs>
    <!-- 顶部斜切渐变 -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004A82"/>
      <stop offset="100%" stop-color="#006BB7"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect id="win_atom_1" width="1280" height="720" fill="#FAFCFF"/>
  
  <!-- 顶部蓝色装饰带 -->
  <rect id="win_atom_2" x="0" y="0" width="1280" height="80" fill="url(#headerGradient)"/>
  
  <!-- 下方的浅色过渡 -->
  <rect id="win_atom_3" x="0" y="80" width="1280" height="15" fill="#E3F2FD"/>
  
  <!-- 页面标题 -->
  <text id="win_atom_4" x="60" y="52" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="bold">{{PAGE_TITLE}}</text>
  
  <!-- Logo（右上角，在斜切带上） -->
  <image id="win_atom_5" x="1080" y="15" width="200" height="50" xlink:href="../images/卫宁健康logo2.png" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- 左侧金色装饰竖线（贯穿内容区） -->
  <rect id="win_atom_6" x="40" y="130" width="3" height="480" fill="#D4A84B" fill-opacity="0.6"/>
  
  <!-- 核心观点条 -->
  <rect id="win_atom_7" x="60" y="120" width="1160" height="50" fill="#E3F2FD" rx="6"/>
  <rect id="win_atom_8" x="60" y="120" width="4" height="50" fill="#006BB7"/>
  <text id="win_atom_9" x="80" y="152" fill="#006BB7" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">核心观点</text>
  <text id="win_atom_10" x="170" y="152" fill="#333D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">{{KEY_MESSAGE}}</text>
  
  <!-- 内容区域占位 -->
  <rect id="win_atom_11" x="60" y="190" width="1160" height="440" fill="#FFFFFF" stroke="#E3F2FD" stroke-width="2" rx="8"/>
  <text id="win_atom_12" x="640" y="410" text-anchor="middle" fill="#B0C4D4" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">{{CONTENT_AREA}}</text>
  
  <!-- 底部波浪装饰 -->
  <path id="win_atom_13" d="M0,690 Q160,680 320,690 T640,680 T960,690 T1280,680 L1280,720 L0,720 Z" fill="#006BB7" fill-opacity="0.05"/>
  
  <!-- 页脚区域 -->
  <rect id="win_atom_14" x="0" y="650" width="1280" height="70" fill="#FAFCFF"/>
  
  <!-- 页脚左侧：数据来源 -->
  <text id="win_atom_15" x="60" y="685" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">数据来源：{{SOURCE}}</text>
  
  
  
  <!-- 左下角金色光点 -->
  <circle id="win_atom_16" cx="50" cy="670" r="3" fill="#D4A84B" fill-opacity="0.5"/>
</svg>
