<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" height="720" width="1280" data-pptx-master="win_1" data-pptx-master-name="卫宁健康-AI汇报" data-pptx-layout="win_1_4" data-pptx-layout-name="03_content" viewBox="0 0 1280 720">
    <!-- 模板: 内容页 - Anthropic 风格 -->
    
    <defs>
        <!-- 卡片渐变 -->
        <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFFFF"/>
            <stop offset="100%" style="stop-color:#F8FAFC"/>
        </linearGradient>
    </defs>
    
    <!-- 白色背景 -->
    <rect id="win_atom_1" width="1280" height="720" fill="#FFFFFF"/>
    
    <!-- 顶部橙色装饰条 -->
    <rect id="win_atom_2" x="0" y="0" width="1280" height="6" fill="#D97757"/>
    
    <!-- 页面标题（核心观点） -->
    <text id="win_atom_3" x="60" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1A1A2E">
        {{PAGE_TITLE}}
    </text>
    <text id="win_atom_4" x="60" y="135" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1A1A2E">
        {{PAGE_TITLE_LINE2}}
    </text>
    
    <!-- 三列卡片布局 -->
    <!-- 卡片1 - 绿色（推荐/成功） -->
    <g id="win_atom_5" data-pptx-bounds="60 180 360 420">
        <rect id="win_atom_6" x="60" y="180" width="360" height="420" fill="url(#cardGradient)" stroke="#E2E8F0" stroke-width="1" rx="12"/>
        <rect id="win_atom_7" x="60" y="180" width="360" height="6" fill="#10B981" rx="3"/>
        
        <!-- 图标背景 -->
        <circle id="win_atom_8" cx="130" cy="250" r="35" fill="#10B981" fill-opacity="0.1"/>
        <!-- 图标占位 -->
        <text id="win_atom_9" x="130" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#10B981">💡</text>
        
        <!-- 卡片标题 -->
        <text id="win_atom_10" x="90" y="320" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E">{{CARD_1_TITLE}}</text>
        <text id="win_atom_11" x="90" y="348" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#64748B">{{CARD_1_SUBTITLE}}</text>
        
        <!-- 卡片内容 -->
        <text id="win_atom_12" x="90" y="400" font-family="Arial, sans-serif" font-size="16" fill="#1A1A2E">{{CARD_1_LINE1}}</text>
        <text id="win_atom_13" x="90" y="428" font-family="Arial, sans-serif" font-size="16" fill="#1A1A2E">{{CARD_1_LINE2}}</text>
        <text id="win_atom_14" x="90" y="470" font-family="Arial, sans-serif" font-size="15" fill="#64748B">{{CARD_1_NOTE1}}</text>
        <text id="win_atom_15" x="90" y="494" font-family="Arial, sans-serif" font-size="15" fill="#64748B">{{CARD_1_NOTE2}}</text>
        
        <!-- 标签 -->
        <rect id="win_atom_16" x="90" y="545" width="80" height="28" fill="#10B981" fill-opacity="0.1" rx="14"/>
        <text id="win_atom_17" x="130" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#10B981">{{CARD_1_TAG}}</text>
    </g>
    
    <!-- 卡片2 - 蓝色（流程/架构） -->
    <g id="win_atom_18" data-pptx-bounds="460 180 360 420">
        <rect id="win_atom_19" x="460" y="180" width="360" height="420" fill="url(#cardGradient)" stroke="#E2E8F0" stroke-width="1" rx="12"/>
        <rect id="win_atom_20" x="460" y="180" width="360" height="6" fill="#4A90D9" rx="3"/>
        
        <!-- 图标背景 -->
        <circle id="win_atom_21" cx="530" cy="250" r="35" fill="#4A90D9" fill-opacity="0.1"/>
        <!-- 图标占位 -->
        <text id="win_atom_22" x="530" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#4A90D9">⚡</text>
        
        <!-- 卡片标题 -->
        <text id="win_atom_23" x="490" y="320" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E">{{CARD_2_TITLE}}</text>
        <text id="win_atom_24" x="490" y="348" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#64748B">{{CARD_2_SUBTITLE}}</text>
        
        <!-- 卡片内容 -->
        <text id="win_atom_25" x="490" y="400" font-family="Arial, sans-serif" font-size="16" fill="#1A1A2E">{{CARD_2_LINE1}}</text>
        <text id="win_atom_26" x="490" y="428" font-family="Arial, sans-serif" font-size="16" fill="#1A1A2E">{{CARD_2_LINE2}}</text>
        <text id="win_atom_27" x="490" y="470" font-family="Arial, sans-serif" font-size="15" fill="#64748B">{{CARD_2_NOTE1}}</text>
        <text id="win_atom_28" x="490" y="494" font-family="Arial, sans-serif" font-size="15" fill="#64748B">{{CARD_2_NOTE2}}</text>
        
        <!-- 标签 -->
        <rect id="win_atom_29" x="490" y="545" width="80" height="28" fill="#4A90D9" fill-opacity="0.1" rx="14"/>
        <text id="win_atom_30" x="530" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#4A90D9">{{CARD_2_TAG}}</text>
    </g>
    
    <!-- 卡片3 - 橙色（关键洞察） -->
    <g id="win_atom_31" data-pptx-bounds="860 180 360 420">
        <rect id="win_atom_32" x="860" y="180" width="360" height="420" fill="url(#cardGradient)" stroke="#E2E8F0" stroke-width="1" rx="12"/>
        <rect id="win_atom_33" x="860" y="180" width="360" height="6" fill="#D97757" rx="3"/>
        
        <!-- 图标背景 -->
        <circle id="win_atom_34" cx="930" cy="250" r="35" fill="#D97757" fill-opacity="0.1"/>
        <!-- 图标占位 -->
        <text id="win_atom_35" x="930" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#D97757">⚙️</text>
        
        <!-- 卡片标题 -->
        <text id="win_atom_36" x="890" y="320" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E">{{CARD_3_TITLE}}</text>
        <text id="win_atom_37" x="890" y="348" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#64748B">{{CARD_3_SUBTITLE}}</text>
        
        <!-- 卡片内容 -->
        <text id="win_atom_38" x="890" y="400" font-family="Arial, sans-serif" font-size="16" fill="#1A1A2E">{{CARD_3_LINE1}}</text>
        <text id="win_atom_39" x="890" y="428" font-family="Arial, sans-serif" font-size="16" fill="#1A1A2E">{{CARD_3_LINE2}}</text>
        <text id="win_atom_40" x="890" y="470" font-family="Arial, sans-serif" font-size="15" fill="#64748B">{{CARD_3_NOTE1}}</text>
        <text id="win_atom_41" x="890" y="494" font-family="Arial, sans-serif" font-size="15" fill="#64748B">{{CARD_3_NOTE2}}</text>
        
        <!-- 标签 -->
        <rect id="win_atom_42" x="890" y="545" width="80" height="28" fill="#D97757" fill-opacity="0.1" rx="14"/>
        <text id="win_atom_43" x="930" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#D97757">{{CARD_3_TAG}}</text>
    </g>
    
    <!-- Executor 自由布局锚点 -->
    <text id="win_atom_44" x="640" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#CBD5E1">
        {{CONTENT_AREA}}
    </text>

</svg>