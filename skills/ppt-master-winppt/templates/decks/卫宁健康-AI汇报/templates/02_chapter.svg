<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" height="720" width="1280" data-pptx-master="win_1" data-pptx-master-name="卫宁健康-AI汇报" data-pptx-layout="win_1_2" data-pptx-layout-name="02_chapter" viewBox="0 0 1280 720">
    <!-- 模板: 章节页 - Anthropic 风格 -->
    
    <defs>
        <!-- 背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1A1A2E"/>
            <stop offset="50%" style="stop-color:#16213E"/>
            <stop offset="100%" style="stop-color:#0F0F1A"/>
        </linearGradient>
        <!-- 橙色渐变 -->
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#D97757"/>
            <stop offset="100%" style="stop-color:#E8956F"/>
        </linearGradient>
        <!-- 光晕 -->
        <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#D97757;stop-opacity:0.25"/>
            <stop offset="100%" style="stop-color:#D97757;stop-opacity:0"/>
        </radialGradient>
    </defs>
    
    <!-- 渐变背景 -->
    <rect id="win_atom_1" width="1280" height="720" fill="url(#bgGradient)"/>
    
    <!-- 网格装饰线 -->
    <line id="win_atom_3" x1="0" y1="180" x2="1280" y2="180" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        <line id="win_atom_4" x1="0" y1="360" x2="1280" y2="360" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        <line id="win_atom_5" x1="0" y1="540" x2="1280" y2="540" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        <line id="win_atom_6" x1="320" y1="0" x2="320" y2="720" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        <line id="win_atom_7" x1="640" y1="0" x2="640" y2="720" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
        <line id="win_atom_8" x1="960" y1="0" x2="960" y2="720" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    <!-- 光晕效果 -->
    <ellipse id="win_atom_9" cx="640" cy="360" rx="400" ry="300" fill="url(#glowOrange)"/>
    
    <!-- 装饰圆形 -->
    <circle id="win_atom_10" cx="200" cy="200" r="80" fill="#4A90D9" fill-opacity="0.05"/>
    <circle id="win_atom_11" cx="1080" cy="520" r="100" fill="#D97757" fill-opacity="0.05"/>
    
    <!-- 章节编号背景 -->
    <text id="win_atom_12" x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="200" font-weight="bold" fill="#FFFFFF" fill-opacity="0.03">
        {{CHAPTER_NUM}}
    </text>
    
    <!-- SECTION 标签 -->
    <text id="win_atom_13" x="640" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#D97757" letter-spacing="4">
        SECTION {{CHAPTER_NUM}}
    </text>
    
    <!-- 装饰线 -->
    <rect id="win_atom_14" x="540" y="320" width="200" height="3" fill="url(#accentGradient)" rx="1.5"/>
    
    <!-- 章节标题 -->
    <text id="win_atom_15" x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">
        {{CHAPTER_TITLE}}
    </text>
    
    <!-- 章节描述 -->
    <text id="win_atom_16" x="640" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" fill-opacity="0.7">
        {{CHAPTER_DESC}}
    </text>
    
    <!-- 底部装饰线 -->
    <rect id="win_atom_17" x="60" y="650" width="1160" height="1" fill="#FFFFFF" fill-opacity="0.1"/>
    
    <!-- 页码 -->
    <text id="win_atom_18" x="640" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748B">
        {{PAGE_NUM}} / {{TOTAL_PAGES}}
    </text>

</svg>